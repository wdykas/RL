# ThunderSync canonical configuration (generated by clean_branch/canon/make_canonical.py; do not hand-edit).
# Every thundersync.* key and the batch-invariant recipe / engine / learner keys, with the PRODUCTION value of
# the final configuration (ts_scale: sticky routing + pooled ⊥-BV + cohort lanes 2 with lookahead 2, engine-side
# q, learner verification, eager learner with host-sync-free MoE device dispatch, engine CUDA graphs on,
# verify0 prefix cache off). A trailing '# code default: X' marks keys whose code default differs.
# Per-run settings are not here: model, layout (TP/PP/EP, nodes), run length, checkpoints, exactness-check
# profile (THUNDERSYNC_* check variables). Behaviour-changing NEMO_RL_* variables are listed under
# policy.megatron_cfg.env_vars until they become config keys.
defaults: ab/ab_ts_scale.yaml

thundersync:
  # -- core streaming / learner
  granularity: "group"  # code default: "trajectory"
  rollout_lag: 0
  storage_device: "cuda"
  max_buckets_per_group: 2
  max_open_groups: 4
  max_chunk_trajectories: 8
  deal_rows: true
  merge_pipeline_calls: true
  min_pipeline_microbatches: null
  train_micro_batch_tokens: 20480  # code default: 32768; per run: MBS x (prompt cap + generation cap)
  stream_training_over_tails: true
  canonical_group_order: true
  canonical_block_groups: 4
  canonical_block_tokens: null
  tail_group_order: "kept"  # code default: "index"
  short_fillers: true  # code default: false
  weight_sentinel: true
  # -- speculation and verification
  speculate: true  # code default: false
  draft_budget: 8192  # code default: 4096; per run: = policy.generation.max_new_tokens
  draft_start_frac: 0.0
  spec_head_k: 64
  draft_variants: 1
  variant_eps: 0.02
  verify_mode: "block"
  verify_precision: "model"  # code default: "fp32"
  verify_lazy: false
  verify_source: "engine"  # code default: "scorer"
  hidden_transport: "object_store"
  verify_on: "learner"  # code default: "both"
  verify_chunks: 4
  verify_overlap: true
  verify_pool_weights: null
  verify_longest_first: true
  verify_batch_tokens: 16384
  verify0_batch_tokens: 20480  # code default: null; per run: = NEMO_RL_MOE_DEVICE_DISPATCH_TOKENS (the dispatch token cap)
  verify_yield: true  # code default: false
  # -- sticky routing and sampling law
  sticky_routing: true  # code default: false
  sticky_routing_delta: 0.03
  sticky_rounding: false
  exact_top_p: false
  sticky_nucleus: false
  sticky_nucleus_delta: 0.01
  sticky_nucleus_cap: 64
  engine_sampler: "wide"
  plain_engine_sampler: "engine"
  wide_sampler_key64: true
  banded_is_band: null
  # -- continuation / tails
  sticky_continuation_chunk_tokens: 128
  sticky_continuation_chunk_growth: 0  # code default: 1.0
  sticky_continuation_decision: "every"
  sticky_continuation_decision_dip: 0.1
  sticky_pieces_in_flight: 1
  sticky_anchor_horizon: null
  tail_excluded_baseline: false
  # -- pooled null block verification (⊥-BV) and draft admission
  null_bv: true  # code default: false
  null_bv_drafts_per_output: 2.0  # code default: 1.5
  null_bv_logratio_var: 8e-07
  null_bv_fixed_m: null
  null_bv_calibrate: true  # code default: false
  null_bv_calibration_decay: 0.5
  null_bv_tail_weight: 1.0
  null_bv_prompt_drop: false
  null_bv_spare_prompts: 0
  null_bv_drop_is: false
  draft_admission: "fit"  # code default: "auto"
  # -- cohort lanes and draft timing
  cohort_lanes: 2  # code default: 1
  cohort_lane_lookahead: 2  # code default: 1
  draft_lookahead: 1  # code default: 3
  draft_weights: "current"
  draft_until_complete: false
  draft_cut_slack_s: 0.5  # code default: 0.0
  draft_window_pace: false
  draft_window_pace_margin: 0.05
  draft_window_pace_max_wait_frac: 0.3
  draft_window_pace_init_s: null
  # -- learner prefix cache
  learner_prefix_cache: true  # code default: false
  learner_prefix_cache_gpu_gb: 4  # code default: 8.0
  learner_prefix_cache_max_gb: 32.0
  learner_prefix_cache_size: "auto"
  learner_prefix_cache_policy: "pin"
  learner_prefix_cache_min_hit_frac: 0.0
  learner_prefix_cache_verify0: false
  # -- opt-in alternatives (off in production)
  engine_verify_block_groups: null
  engine_verify_first_block_groups: null
  engine_verify_prefetch: false
  tail_lookup: false
  tail_lookup_max_refs: 8
  fused_verify_train: false
  fused_max_retained_tokens: 16384
  verify0_stream: false
  verify0_stream_first_chunk_tokens: 262144
  verify0_stream_chunk_tokens: 524288
  verify0_stream_window: 2
  verify0_stream_order: "risk"
  anchor_epoch: null
  anchor_weights: "raw"
  anchor_start: 0
  anchor_momentum_steps: 1
  anchor_reserve_rows: 32
  vit_min_pass_prob: 0.5
  vit_pass_window: 4
  vit_checkpoint_gb: 16.0
  vit_bytes_per_token: 1000000.0
  draft_after_verify: false
  verify_in_train: false

policy:
  megatron_cfg:
    # -- batch-invariant fp16-GEMM recipe (training == engine numerics)
    zero_train_gen_mismatch: true
    batch_invariant_mode: true
    batch_invariant_backend: "te_native"
    batch_invariant_collective: "ordered"
    flash_attention_version: 4
    attention_backend: "flash"
    forward_gemm_precision: "fp16"
    fp32_residual_connection: true
    defer_fp32_logits: true
    moe_router_dtype: "fp32"
    moe_permute_fusion: false
    bias_activation_fusion: false
    env_vars:
      # learner: eager + host-sync-free MoE device dispatch (LGRAPHS=dd); tokens = the dispatch token cap
      NEMO_RL_MOE_DEVICE_DISPATCH: "1"
      NEMO_RL_MOE_DEVICE_DISPATCH_TOKENS: "20480"  # per run: max(MBS x (prompt cap + generation cap), 18432)
      NEMO_RL_MOE_DEVICE_DISPATCH_CAPACITY: "2.0"
      NEMO_RL_LEARNER_DEFER_METRICS: "1"
      NEMO_RL_LEARNER_GRAPHS_SHARED_POOL: "0"
  generation:
    refit_transport: "mcore"
    mcore_generation_config:
      # engine CUDA graphs: decode graphs + every prefill graphed (required)
      cuda_graph_impl: "local"
      num_cuda_graphs: 16
      cuda_graph_all_prefills: true
      transformer_impl: "inference_optimized"
      max_requests: 256
      buffer_size_gb: 48
      async_sched_mode: "async"
      enable_prefix_caching: false
      enable_chunked_prefill: false
      logprobs_mode: "raw_logprobs"
      materialize_only_last_token_logits: true
      progress_log_interval_s: 60
      stall_timeout_s: 600

loss_fn:
  force_on_policy_ratio: true
  use_importance_sampling_correction: false
  reference_policy_kl_penalty: 0.0
  skip_zero_advantage_rows: true
