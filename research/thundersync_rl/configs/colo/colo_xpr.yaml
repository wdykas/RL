# ThunderSync colocated EXACT PARTIAL ROLLOUT, XPR-1 (docs/colo/THEORY.md v2): stock NeMo-RL's
# colocated in_order lag-K loop (the stock partial rollout SPR: at every stand-down the engine pauses the lookahead
# batches' requests, KV kept, and resumes them after the wake at the new weights), made exact by the nolanes verify
# stage: a batch's rows are drafts whose tokens span versions (version-tagged, q logged); at its train step they are
# ⊥-BV-verified against theta_k with the engine stood down, the engine is woken on the same theta_k for the
# continuations (co-batched with the resumed lookahead drafting), and the loop trains after them. Strict alternation:
# generate, stand down, train, refit, as stock.
#
# Composition (later wins): nl_super.yaml (stock recipe + V8b BI numerics + learner-tuned stock settings, nolanes
# verify, cross-fade routing), this file, the launcher CLI (model, shape, layout, lag K, engine capacity, env_name).
#
# Differences to nl_super.yaml, and why:
#   policy.generation.colocated.enabled true             one fleet generates and trains
#   env_vars NEMO_RL_ENGINE_SYMM_TP / _FAST_LOGSOFTMAX 0 engine-process-only levers (raise in a colocated learner)
#   thundersync.train_overlap false, edv_threshold null  both train while the engine decodes (not strict alternation)
#   thundersync.verify_stream_chunks 1                   no continuation starts while the engine is stood down
#   thundersync.tail_mtd 0                               XPR-1 measures the plain tail first (Super-L22 text is noise)
defaults:
  - ../nl/nl_super.yaml

policy:
  megatron_cfg:
    # Batch-invariant Mamba mixer under activation recompute (mamba_ssd_parity.py): a Mamba layer keeps only its input
    # for the backward instead of ~80 KiB / token of fp32 conv / x / z / B / C / dt / scan copies; forward values
    # unchanged. Full-Nano XS at stock's micro-batch 2 OOMed on ~40 GiB of these (snapshot research/colo/mem/
    # nano-xs-m2-2d2c1a0b: _ssm_training 12.1, _scan_and_gate 28 GiB); stock's fused Mamba kernels keep none.
    mamba_recompute: true
    env_vars:
      NEMO_RL_ENGINE_SYMM_TP: "0"
      NEMO_RL_ENGINE_FAST_LOGSOFTMAX: "0"
  # Resident colocated learner (MODEL.md v2 §11): no per-step optimizer / grad offload around the engine phase.
  offload_optimizer_for_refit: false
  generation:
    colocated:
      enabled: true
    mcore_generation_config:
      # Decode stays graphed; prefill runs eager. The all-prefill graph pools stay resident through training in a
      # colocated process and are sized by the lookahead batches' max_requests: with them, XPR's training OOMed by
      # < 0.1 GiB at Super-L22; without them it runs.
      cuda_graph_all_prefills: false

thundersync:
  train_overlap: false
  edv_threshold: null
  verify_stream_chunks: 1
  tail_mtd: 0
