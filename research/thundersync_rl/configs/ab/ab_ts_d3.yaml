# Arm "ts_d3": ThunderSync at depth 3 (lanes-k; la2.py): 3 cohort lanes, the cohort lane of step s drafts cohort
# s + 3 from theta_s once its own cohort is final (drafts age 3; the k - 1 cohorts after step 0 / a boundary fall
# back to lookahead 1). Everything else is arm ts_scale (run_ab_arm.sh LANES=3).
defaults: ab_ts_scale.yaml

thundersync:
  cohort_lanes: 3
  cohort_lane_lookahead: 3
