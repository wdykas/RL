# Arm "async3": lanes-k async GRPO (thundersync.async_lanes, async_lanes.py; research/lanesk/README.md),
# fixed age 3: lane j % 3 generates batch j + 3 from theta_j (3 engine lanes, one weight version each; the first 3 batches at theta_0).
# Everything else is arm async1 (defaults below): same learner path, micro-batching, recipe, wide keyed engine
# sampler, group granularity, loss and token IS correction exp(log pi_theta_k - generation log-prob); only the lag
# (and the engine split into k lanes: run_ab_arm.sh LANES=3, GEN_GPUS = engine GPUs / 3) differs.
defaults: ab_async1.yaml

thundersync:
  rollout_lag: 3
  async_lanes: true
  cohort_lanes: 3
