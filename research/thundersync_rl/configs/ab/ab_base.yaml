# ThunderSync at-scale A/B kit: settings shared by EVERY arm (baselines included), so arms differ
# only in the algorithm block of their own file (ab_<arm>.yaml). Launch: thundersync_work/sbatch/submit_ab.sh;
# arms and metrics: thundersync_work/sbatch/README_ab.md.
#
# Shared: real math RL data (DAPO-Math-17k, DAPO verifier rewards), the model's chat template in
# thinking mode, long rollout caps (policy.max_total_sequence_length, 8k–32k), fixed GRPO group size G,
# the exact-numerics recipe on training AND inference (fp16-GEMM forward with fp32 residual/norms/logits,
# batch-invariant kernels, inference-optimized engine, fp32 router), the same non-colocated Megatron
# engine and the same Megatron learner. Parallelism and node counts come from submit_ab.sh (Hydra overrides).
defaults: "../grpo_math_1.5b_thundersync_megatron.yaml"

grpo:
  num_prompts_per_step: 64
  num_generations_per_prompt: 8  # fixed G (plan of record)
  max_num_steps: 6  # short runs only (4–8) until acceptance/overhead/scale issues are settled
  seed: 42
  val_period: -1
  val_at_start: false
  val_at_end: false

loss_fn:
  reference_policy_kl_penalty: 0.0
  skip_zero_advantage_rows: true

policy:
  model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
  tokenizer:
    name: ${policy.model_name}
    chat_template_kwargs:
      enable_thinking: true
  # run_ab_arm.sh sets max_total_sequence_length = data.max_input_seq_length (PROMPT_CAP) + max_new_tokens (MAXLEN)
  max_total_sequence_length: 10240
  train_micro_batch_size: 1
  logprob_batch_size: 1
  make_sequence_length_divisible_by: 128
  megatron_cfg:
    # Learner memory (DESIGN 14h): selective recompute of the MoE block, as engine_q_tp.sh's ACKPT
    # default at PP=1 (the full-Nano EP8 exactness runs); same on every arm.
    activation_checkpointing: true
    recompute_granularity: selective
    recompute_modules: [moe]
    expert_tensor_parallel_size: 1
    # Exact-numerics recipe (V8b): fp16 GEMM operands, fp32 GEMM outputs / residual / norms / logits.
    forward_gemm_precision: fp16
    fp32_residual_connection: true
    optimizer:
      use_precision_aware_optimizer: false
    moe_router_dtype: fp32
    moe_permute_fusion: false
    bias_activation_fusion: false
    defer_fp32_logits: true
    # Batch invariance (NeMo-RL PR 3208): training forward == engine forward bitwise.
    zero_train_gen_mismatch: true
    batch_invariant_mode: true
    batch_invariant_backend: te_native
    batch_invariant_collective: ordered
    attention_backend: flash
    flash_attention_version: 4
    env_vars:
      CUBLASLT_WORKSPACE_SIZE: "0"
      CUBLAS_WORKSPACE_CONFIG: ":0:0"
  generation:
    max_new_tokens: 8192  # generation cap (run_ab_arm.sh MAXLEN; 16384 / 32768 for the long-cap pass)
    mcore_generation_config:
      transformer_impl: inference_optimized
      logprobs_mode: raw_logprobs
      enable_chunked_prefill: false
      enable_prefix_caching: false  # sticky routing forbids it; off on every arm for parity
      materialize_only_last_token_logits: true
      async_sched_mode: async
      # Concurrent requests per engine rank (every arm). Hybrid models: the Mamba region is
      # sized for exactly this many (the fixed 0.1 buffer share admitted ~8 per rank at full
      # Nemotron-3-Nano). ThunderSync's capacity guard needs max_requests x engine DP >= a
      # cohort's primary drafts (prompts x G): 64 x 8 / 8 ranks = 64 at EP8; lanes run a whole
      # cohort (x K = 1.5) per lane. Set to the primaries per rank of an EP4 lane (64 x 8 / 4 =
      # 128): measured (lanes ord-p-l2, 5336268f) 7.77 s/step at 128 vs 8.57 s at 192 -- extras
      # beyond the primaries compete with them for the drafting lane. One EP8 engine needs 64.
      max_requests: 128
      # Per rank: Mamba state 128 x ~125 MB (full Nano) = 16 GB + KV (6 KiB/token at full Nano,
      # 128 x 10240 tokens = 7.7 GB at an 8k generation cap) under one buffer for every arm.
      buffer_size_gb: 48
      # Progress line every 60 s on engine rank 0 (requests, tokens, tok/s) and a stall watchdog:
      # a busy engine rank without progress for 10 min dumps all stacks and exits non-zero.
      progress_log_interval_s: 60
      stall_timeout_s: 600

data:
  max_input_seq_length: 2048
  shuffle: true
  train:
    dataset_name: DAPOMath17K
  validation: null
  default:
    prompt_file: null
    system_prompt_file: null
    processor: math_hf_data_processor
    env_name: math

env:
  math:
    num_workers: 16
    math_verify_impl: dapo_math_verify

logger:
  log_dir: logs/thundersync_ab
  wandb_enabled: false
  tensorboard_enabled: false
  monitor_gpus: false
