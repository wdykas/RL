# Arm "sync": synchronous GRPO on the ThunderSync learner path (run_thundersync_grpo.py, the same
# worker, micro-batching, recipe and GPUs as the ThunderSync arms), speculation off, batch
# granularity: every rollout of step k is generated at theta_k, then the learner trains on the whole
# batch. Exact on-policy. Learner and engine on separate GPUs (as ts_* and async1).
defaults: ab_base.yaml

thundersync:
  # Same 53-bit keyed engine sampler as the ThunderSync arms (fair A/B; before it these
  # baselines sampled with FlashInfer fp32: tail TV ~1e-5/token, not comparable to 53-bit ts arms).
  plain_engine_sampler: wide
  granularity: batch
  speculate: false
